<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title"><title id="title">Improve the next run with evidence.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="47" font-size="14" fill="#64748b" font-weight="700">NIMBLS / NETWORK SITE MANAGEMENT</text><text x="48" y="105" font-size="38" fill="#191919" font-weight="700">Improve the next run with evidence.</text><text x="48" y="150" font-size="21" fill="#666" font-weight="400">Review real work before changing how an agent behaves.</text><rect x="40" y="198" width="1520" height="364" rx="16" fill="#f3f6f9" stroke="#e1e7ed" stroke-width="2"/><rect x="70.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(92.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="20" ry="7"/><path d="M4 10v28c0 10 40 10 40 0V10M4 24c0 10 40 10 40 0"/></g><text x="92.0" y="354" font-size="23" fill="#191919" font-weight="700">Review</text><text x="92.0" y="395" font-size="18" fill="#666" font-weight="400">Find a missed event</text><text x="92.0" y="421" font-size="18" fill="#666" font-weight="400">or an inaccurate conclusion.</text><path d="M408.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="444.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(466.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h32a5 5 0 0 1 5 5v23a5 5 0 0 1-5 5H19L7 46v-8a5 5 0 0 1-4-5V10a5 5 0 0 1 5-5Z"/><path d="M13 17h22M13 26h15"/></g><text x="466.0" y="354" font-size="23" fill="#191919" font-weight="700">Propose</text><text x="466.0" y="395" font-size="18" fill="#666" font-weight="400">Suggest an instruction</text><text x="466.0" y="421" font-size="18" fill="#666" font-weight="400">or workflow revision.</text><path d="M782.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="818.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(840.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="9"/><path d="M24 5v7M0 22v9m48-9v9M16 33h16"/><circle cx="16" cy="23" r="2"/><circle cx="32" cy="23" r="2"/></g><text x="840.0" y="354" font-size="23" fill="#191919" font-weight="700">Compare</text><text x="840.0" y="395" font-size="18" fill="#666" font-weight="400">Rerun representative cases.</text><text x="840.0" y="421" font-size="18" fill="#666" font-weight="400">Check gains and regressions.</text><path d="M1156.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1192.0" y="245" width="338.0" height="252" rx="16" fill="#fff9df" stroke="#e8c236" stroke-width="2"/><g transform="translate(1214.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3 43 11v15c0 10-19 19-19 19S5 36 5 26V11Z"/><path d="m14 23 7 7 13-14"/></g><text x="1214.0" y="354" font-size="23" fill="#191919" font-weight="700">Keep or revise</text><text x="1214.0" y="395" font-size="18" fill="#666" font-weight="400">User approves adoption</text><text x="1214.0" y="421" font-size="18" fill="#666" font-weight="400">after reviewing evidence.</text><rect x="40" y="606" width="1520" height="119" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><g transform="translate(67 638) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="140" y="646" font-size="14" fill="#64748b" font-weight="700">WHAT THE CUSTOMER GETS</text><text x="140" y="690" font-size="23" fill="#191919" font-weight="700">A reviewed change backed by before-and-after results.</text><text x="48" y="788" font-size="16" fill="#666" font-weight="400">Optional evaluations exist in development. The full review, comparison and adoption workflow remains planned.</text><text x="48" y="820" font-size="15" fill="#64748b" font-weight="400">Planned capability · Concept diagram, not application UI · nimbls is a provisional name</text></g></svg>