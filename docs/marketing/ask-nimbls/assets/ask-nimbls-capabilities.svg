<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title"><title id="title">Ask nimbls capability blocks for Milestone 1 and later Milestones</title><style>text{font-family:Arial,sans-serif;fill:#18232c}.muted{fill:#59666f}.small{font-size:16px}.label{font-size:12px;letter-spacing:2px;font-weight:700}.head{font-size:23px;font-weight:700}</style><rect width="1200" height="510" rx="24" fill="#f5f5f0"/><rect x="400" y="35" width="400" height="88" rx="16" fill="#e8c236"/><text x="600" y="73" text-anchor="middle" class="head">Ask nimbls</text><text x="600" y="101" text-anchor="middle" class="small">One familiar entry, expanding capabilities.</text><path d="M600 123v39H293v38" fill="none" stroke="#52635a" stroke-width="2"/><path d="M600 162h307v38" fill="none" stroke="#52635a" stroke-width="2" stroke-dasharray="6 6"/><rect x="42" y="200" width="502" height="240" rx="16" fill="white" stroke="#cfd8cf"/><rect x="656" y="200" width="502" height="240" rx="16" fill="white" stroke="#cfd8cf" stroke-dasharray="6 5"/><text x="70" y="238" class="label">Milestone 1 · PLANNED SCOPE</text><text x="70" y="277" class="head">Start, shape, repeat</text><text x="70" y="316" class="small">Essential setup · Use default agents</text><text x="70" y="350" class="small">Create and refine agents · Inspect results</text><text x="70" y="384" class="small">Save working instructions · Schedule tasks</text><text x="684" y="238" class="label">LATER Milestones · FUTURE SCOPE</text><text x="684" y="277" class="head">Extend what you can ask</text><text x="684" y="316" class="small">Site history · Local AI · Report organization</text><text x="684" y="350" class="small">Agent improvement · Controlled external help</text><text x="684" y="384" class="small">Authorized device changes and verification</text><text x="42" y="479" class="small muted">Concept diagram · Does not represent released capabilities</text></svg>