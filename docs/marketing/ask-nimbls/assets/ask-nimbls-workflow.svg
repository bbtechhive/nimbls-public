<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title"><title id="title">Ask, review, refine, save and schedule</title><style>text{font-family:Arial,sans-serif;fill:#18232c}.muted{fill:#59666f}.small{font-size:16px}.label{font-size:12px;letter-spacing:2px;font-weight:700}.head{font-size:23px;font-weight:700}</style><rect width="1200" height="320" rx="24" fill="#f5f5f0"/><text x="38" y="49" class="label">ONE REQUEST. A REPEATABLE WORKFLOW.</text><rect x="38" y="83" width="204" height="151" rx="12" fill="white" stroke="#d5dbd5"/><text x="56" y="115" class="label muted">01</text><text x="56" y="159" class="head">Ask</text><text x="56" y="194" class="small muted">Describe the goal.</text><path d="M245 158h20m-6-5 6 5-6 5" fill="none" stroke="#67746d" stroke-width="2"/><rect x="270" y="83" width="204" height="151" rx="12" fill="white" stroke="#d5dbd5"/><text x="288" y="115" class="label muted">02</text><text x="288" y="159" class="head">Review</text><text x="288" y="194" class="small muted">Inspect the evidence.</text><path d="M477 158h20m-6-5 6 5-6 5" fill="none" stroke="#67746d" stroke-width="2"/><rect x="502" y="83" width="204" height="151" rx="12" fill="white" stroke="#d5dbd5"/><text x="520" y="115" class="label muted">03</text><text x="520" y="159" class="head">Refine</text><text x="520" y="194" class="small muted">Shape the result.</text><path d="M709 158h20m-6-5 6 5-6 5" fill="none" stroke="#67746d" stroke-width="2"/><rect x="734" y="83" width="204" height="151" rx="12" fill="white" stroke="#d5dbd5"/><text x="752" y="115" class="label muted">04</text><text x="752" y="159" class="head">Save</text><text x="752" y="194" class="small muted">Keep what works.</text><path d="M941 158h20m-6-5 6 5-6 5" fill="none" stroke="#67746d" stroke-width="2"/><rect x="966" y="83" width="204" height="151" rx="12" fill="white" stroke="#d5dbd5"/><text x="984" y="115" class="label muted">05</text><text x="984" y="159" c