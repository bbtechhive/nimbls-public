<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title"><title id="title">Daily work, without a daily prompt.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="47" font-size="14" fill="#64748b" font-weight="700">NIMBLS / NETWORK SITE MANAGEMENT</text><text x="48" y="105" font-size="38" fill="#191919" font-weight="700">Daily work, without a daily prompt.</text><text x="48" y="150" font-size="21" fill="#666" font-weight="400">Saved tasks run on the configured schedule.</text><rect x="40" y="198" width="1520" height="364" rx="16" fill="#f3f6f9" stroke="#e1e7ed" stroke-width="2"/><rect x="70.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(92.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M24 12v13l9 5"/></g><text x="92.0" y="354" font-size="23" fill="#191919" font-weight="700">Schedule</text><text x="92.0" y="395" font-size="18" fill="#666" font-weight="400">Choose when to run.</text><text x="92.0" y="421" font-size="18" fill="#666" font-weight="400">Use the saved task.</text><path d="M408.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="444.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(466.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="2" width="20" height="14" rx="3"/><path d="M24 16v13M6 29h36M6 29v6m18-6v6m18-6v6"/><rect x="1" y="35" width="10" height="10" rx="2"/><rect x="19" y="35" width="10" height="10" rx="2"/><rect x="37" y="35" width="10" height="10" rx="2"/></g><text x="466.0" y="354" font-size="23" fill="#191919" font-weight="700">Retrieve</text><text x="466.0" y="395" font-size="18" fill="#666" font-weight="400">Get scoped NIMBL data</text><text x="466.0" y="421" font-size="18" fill="#666" font-weight="400">through bbcli.</text><path d="M782.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="818.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(840.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="9"/><path d="M24 5v7M0 22v9m48-9v9M16 33h16"/><circle cx="16" cy="23" r="2"/><circle cx="32" cy="23" r="2"/></g><text x="840.0" y="354" font-size="23" fill="#191919" font-weight="700">Analyze</text><text x="840.0" y="395" font-size="18" fill="#666" font-weight="400">Review events.</text><text x="840.0" y="421" font-size="18" fill="#666" font-weight="400">Keep evidence references.</text><path d="M1156.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1192.0" y="245" width="338.0" height="252" rx="16" fill="#fff9df" stroke="#e8c236" stroke-width="2"/><g transform="translate(1214.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="1214.0" y="354" font-size="23" fill="#191919" font-weight="700">Deliver</text><text x="1214.0" y="395" font-size="18" fill="#666" font-weight="400">Save a fresh report.</text><text x="1214.0" y="421" font-size="18" fill="#666" font-weight="400">Make the outcome visible.</text><rect x="40" y="606" width="1520" height="119" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><g transform="translate(67 638) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="140" y="646" font-size="14" fill="#64748b" font-weight="700">WHAT THE CUSTOMER GETS</text><text x="140" y="690" font-size="23" fill="#191919" font-weight="700">A fresh report and an honest record of each scheduled attempt.</text><text x="48" y="788" font-size="16" fill="#666" font-weight="400">Background execution, overlap skips and failures require validation; no missed-run catch-up is implied.</text><text x="48" y="820" font-size="15" fill="#64748b" font-weight="400">Planned capability · Concept diagram, not application UI · nimbls is a provisional name</text></g></svg>