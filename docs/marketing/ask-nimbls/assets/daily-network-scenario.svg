<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title"><title id="title">A day in network operations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="47" font-size="14" fill="#64748b" font-weight="700">NIMBLS / NETWORK SITE MANAGEMENT</text><text x="48" y="105" font-size="38" fill="#191919" font-weight="700">A day in network operations</text><text x="48" y="150" font-size="21" fill="#666" font-weight="400">One illustrative customer journey—from a scheduled check to a verified outcome.</text><rect x="50" y="208" width="465" height="212" rx="16" fill="#f3f6f9" stroke="#dce3e9" stroke-width="2"/><g transform="translate(72 231) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M24 12v13l9 5"/></g><text x="72" y="308" font-size="24" fill="#191919" font-weight="700">01  Scheduled check</text><text x="72" y="351" font-size="19" fill="#666" font-weight="400">The saved daily task starts.</text><path d="M515 317h50" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="565" y="208" width="465" height="212" rx="16" fill="#f3f6f9" stroke="#dce3e9" stroke-width="2"/><g transform="translate(587 231) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="2" width="20" height="14" rx="3"/><path d="M24 16v13M6 29h36M6 29v6m18-6v6m18-6v6"/><rect x="1" y="35" width="10" height="10" rx="2"/><rect x="19" y="35" width="10" height="10" rx="2"/><rect x="37" y="35" width="10" height="10" rx="2"/></g><text x="587" y="308" font-size="24" fill="#191919" font-weight="700">02  Review events</text><text x="587" y="351" font-size="19" fill="#666" font-weight="400">NIMBL data reveals recurring</text><text x="587" y="377" font-size="19" fill="#666" font-weight="400">link interruptions.</text><path d="M1030 317h50" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1080" y="208" width="465" height="212" rx="16" fill="#f3f6f9" stroke="#dce3e9" stroke-width="2"/><g transform="translate(1102 231) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="20" ry="7"/><path d="M4 10v28c0 10 40 10 40 0V10M4 24c0 10 40 10 40 0"/></g><text x="1102" y="308" font-size="24" fill="#191919" font-weight="700">03  Compare history</text><text x="1102" y="351" font-size="19" fill="#666" font-weight="400">Find a previous case and</text><text x="1102" y="377" font-size="19" fill="#666" font-weight="400">inspect changes and timing.</text><rect x="50" y="462" width="465" height="212" rx="16" fill="#f3f6f9" stroke="#dce3e9" stroke-width="2"/><g transform="translate(72 485) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="14"/><path d="m31 31 13 13M12 20h16m-8-8v16"/></g><text x="72" y="562" font-size="24" fill="#191919" font-weight="700">04  Explain findings</text><text x="72" y="605" font-size="19" fill="#666" font-weight="400">Cite evidence and gaps.</text><text x="72" y="631" font-size="19" fill="#666" font-weight="400">Recommend a next step.</text><path d="M515 571h50" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="565" y="462" width="465" height="212" rx="16" fill="#f3f6f9" stroke="#dce3e9" stroke-width="2"/><g transform="translate(587 485) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3 43 11v15c0 10-19 19-19 19S5 36 5 26V11Z"/><path d="m14 23 7 7 13-14"/></g><text x="587" y="562" font-size="24" fill="#191919" font-weight="700">05  Authorize action</text><text x="587" y="605" font-size="19" fill="#666" font-weight="400">Approve a supported change</text><text x="587" y="631" font-size="19" fill="#666" font-weight="400">within the defined scope.</text><path d="M1030 571h50" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1080" y="462" width="465" height="212" rx="16" fill="#fff9df" stroke="#e8c236" stroke-width="2"/><g transform="translate(1102 485) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="1102" y="562" font-size="24" fill="#191919" font-weight="700">06  Verify &amp; retain</text><text x="1102" y="605" font-size="19" fill="#666" font-weight="400">Check actual device state.</text><text x="1102" y="631" font-size="19" fill="#666" font-weight="400">Save results for later use.</text><path d="M1510 420V445H30V570H50" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><text x="48" y="788" font-size="16" fill="#666" font-weight="400">Illustrative journey across planned stages. Investigation and authorized changes extend beyond the initial daily-report Milestone.</text><text x="48" y="820" font-size="15" fill="#64748b" font-weight="400">Planned capability · Concept diagram, not application UI · nimbls is a provisional name</text></g></svg>