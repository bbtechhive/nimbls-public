<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc"><title id="title">Milestone evolution: from agents to controlled action</title><desc id="desc">Seven planned stages build cumulatively: agent foundation, site knowledge, local intelligence, useful deliverables, reviewed self-improvement, secure external AI assistance, and bounded device control with rollback.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52705c" stroke-width="1.4"/></marker></defs><rect width="1200" height="1230" rx="20" fill="#faf8ef"/><g font-family="Arial, Helvetica, sans-serif" fill="#193b2d"><text x="48" y="52" font-size="14" font-weight="700" letter-spacing="2">NIMBLS · CONCEPT &amp; CAPABILITY EVOLUTION</text><text x="48" y="105" font-size="38" font-weight="700">From agents to controlled action.</text><text x="48" y="143" font-size="19" fill="#52695b">Each milestone builds on earlier capabilities. All stages are planned.</text><path d="M48 175 H1152" stroke="#d7ddd2"/><text x="126" y="210" font-size="13" letter-spacing="1.5" font-weight="700">CONCEPT</text><text x="474" y="210" font-size="13" letter-spacing="1.5" font-weight="700">CAPABILITIES ADDED</text><text x="840" y="210" font-size="13" letter-spacing="1.5" font-weight="700">WHAT THIS ENABLES</text><rect x="40" y="232" width="1120" height="108" rx="12" fill="#f0f1e8" stroke="#dce1d6"/><path d="M82 311 V354" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="280" r="24" fill="#e8c236"/><text x="82" y="287" text-anchor="middle" font-size="19" font-weight="700">01</text><text x="126" y="275" font-size="22" font-weight="700">Agent foundation</text><rect x="126" y="298" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="184" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="213" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="242" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="271" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="300" y="298" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="274" font-size="18" fill="#294b39">Execution · Memory</text><text x="474" y="303" font-size="18" fill="#294b39">Shared NIMBL connection</text><text x="840" y="274" font-size="17" fill="#52695b">Run a task and retain context.</text><text x="840" y="303" font-size="17" fill="#52695b">Connect agents to site data.</text><rect x="40" y="360" width="1120" height="108" rx="12" fill="#ffffff" stroke="#dce1d6"/><path d="M82 439 V482" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="408" r="24" fill="#e8c236"/><text x="82" y="415" text-anchor="middle" font-size="19" font-weight="700">02</text><text x="126" y="403" font-size="22" font-weight="700">Site knowledge</text><rect x="126" y="426" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="426" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="426" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="213" y="426" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="242" y="426" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="271" y="426" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="300" y="426" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="402" font-size="18" fill="#294b39">Ready-to-use site agents</text><text x="474" y="431" font-size="18" fill="#294b39">Collect → Analyze → Filter → Retain</text><text x="840" y="402" font-size="17" fill="#52695b">Turn raw observations into</text><text x="840" y="431" font-size="17" fill="#52695b">useful, reusable site knowledge.</text><rect x="40" y="488" width="1120" height="108" rx="12" fill="#f0f1e8" stroke="#dce1d6"/><path d="M82 567 V610" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="536" r="24" fill="#e8c236"/><text x="82" y="543" text-anchor="middle" font-size="19" font-weight="700">03</text><text x="126" y="531" font-size="22" font-weight="700">Local intelligence</text><rect x="126" y="554" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="554" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="554" width="23" height="6" rx="3" fill="#52705c"/><rect x="213" y="554" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="242" y="554" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="271" y="554" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="300" y="554" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="530" font-size="18" fill="#294b39">Local model support</text><text x="474" y="559" font-size="18" fill="#294b39">Tasks processed on local hardware</text><text x="840" y="530" font-size="17" fill="#52695b">Run supported workflows</text><text x="840" y="559" font-size="17" fill="#52695b">with local AI inference.</text><rect x="40" y="616" width="1120" height="108" rx="12" fill="#ffffff" stroke="#dce1d6"/><path d="M82 695 V738" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="664" r="24" fill="#e8c236"/><text x="82" y="671" text-anchor="middle" font-size="19" font-weight="700">04</text><text x="126" y="659" font-size="22" font-weight="700">Useful deliverables</text><rect x="126" y="682" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="682" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="682" width="23" height="6" rx="3" fill="#52705c"/><rect x="213" y="682" width="23" height="6" rx="3" fill="#52705c"/><rect x="242" y="682" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="271" y="682" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="300" y="682" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="658" font-size="18" fill="#294b39">Reports · Dashboards · Analysis</text><text x="474" y="687" font-size="18" fill="#294b39">Generate → Refine → Polish</text><text x="840" y="658" font-size="17" fill="#52695b">Turn findings into clear outputs</text><text x="840" y="687" font-size="17" fill="#52695b">people can explore and use.</text><rect x="40" y="744" width="1120" height="108" rx="12" fill="#f0f1e8" stroke="#dce1d6"/><path d="M82 823 V866" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="792" r="24" fill="#e8c236"/><text x="82" y="799" text-anchor="middle" font-size="19" font-weight="700">05</text><text x="126" y="787" font-size="22" font-weight="700">Reviewed self-improvement</text><rect x="126" y="810" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="810" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="810" width="23" height="6" rx="3" fill="#52705c"/><rect x="213" y="810" width="23" height="6" rx="3" fill="#52705c"/><rect x="242" y="810" width="23" height="6" rx="3" fill="#52705c"/><rect x="271" y="810" width="23" height="6" rx="3" fill="#e0e5dc"/><rect x="300" y="810" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="786" font-size="18" fill="#294b39">Agent-proposed adjustments</text><text x="474" y="815" font-size="18" fill="#294b39">Review → Validate → Adopt</text><text x="840" y="786" font-size="17" fill="#52695b">Improve instructions and workflows</text><text x="840" y="815" font-size="17" fill="#52695b">with evidence of better results.</text><rect x="40" y="872" width="1120" height="108" rx="12" fill="#ffffff" stroke="#dce1d6"/><path d="M82 951 V994" stroke="#52705c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="82" cy="920" r="24" fill="#e8c236"/><text x="82" y="927" text-anchor="middle" font-size="19" font-weight="700">06</text><text x="126" y="915" font-size="22" font-weight="700">Secure expert assistance</text><rect x="126" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="213" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="242" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="271" y="938" width="23" height="6" rx="3" fill="#52705c"/><rect x="300" y="938" width="23" height="6" rx="3" fill="#e0e5dc"/><text x="474" y="914" font-size="18" fill="#294b39">External frontier AI</text><text x="474" y="943" font-size="18" fill="#294b39">Controlled disclosure · Local validation</text><text x="840" y="914" font-size="17" fill="#52695b">Handle harder tasks with outside</text><text x="840" y="943" font-size="17" fill="#52695b">help inside a secure data boundary.</text><rect x="40" y="1000" width="1120" height="108" rx="12" fill="#f0f1e8" stroke="#dce1d6"/><circle cx="82" cy="1048" r="24" fill="#e8c236"/><text x="82" y="1055" text-anchor="middle" font-size="19" font-weight="700">07</text><text x="126" y="1043" font-size="22" font-weight="700">Bounded device control</text><rect x="126" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="155" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="184" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="213" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="242" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="271" y="1066" width="23" height="6" rx="3" fill="#52705c"/><rect x="300" y="1066" width="23" height="6" rx="3" fill="#52705c"/><text x="474" y="1042" font-size="18" fill="#294b39">Device management &amp; configuration</text><text x="474" y="1071" font-size="18" fill="#294b39">Authorize → Execute → Verify → Roll back</text><text x="840" y="1042" font-size="17" fill="#52695b">Apply supported device changes</text><text x="840" y="1071" font-size="17" fill="#52695b">with safety boundaries and recovery.</text><path d="M48 1150 H1152" stroke="#d7ddd2"/><text x="48" y="1186" font-size="17" font-weight="700">Execute → Remember → Think locally → Produce → Improve → Consult → Act safely</text><text x="48" y="1212" font-size="13" fill="#52695b">Cumulative capability path · Concept diagram, not a released-feature or completion record · Development code name</text></g></svg>