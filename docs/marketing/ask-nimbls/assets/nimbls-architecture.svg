<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc"><title id="title">Ask nimbls. Put NIMBL to work.</title><desc id="desc">Planned architecture: scheduled agents work through bbcli and NIMBL to inspect network devices and perform authorized operations. People configure and refine agents through Ask nimbls. Site history, results, and local models support the work. Optional external assistance passes through a disclosure gate and proposed relay.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1920" height="1280" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="48" font-size="14" fill="#666" font-weight="700">BIG PICTURE / NETWORK SITE MANAGEMENT</text><text x="48" y="102" font-size="42" fill="#191919" font-weight="700">Ask nimbls. Put NIMBL to work.</text><text x="48" y="140" font-size="22" fill="#666" font-weight="400">Agents keep watch, investigate issues, and handle routine network operations—powered by NIMBL.</text><rect x="40" y="180" width="1440" height="1000" rx="16" fill="#fafafa" stroke="#dedede" stroke-width="2"/><text x="66" y="215" font-size="14" fill="#666" font-weight="700">YOUR SITE / APPROVED LOCAL ENVIRONMENT</text><rect x="630" y="240" width="820" height="700" rx="16" fill="#fff" stroke="#c9c9c9" stroke-width="2"/><text x="656" y="276" font-size="28" fill="#191919" font-weight="700">nimbls</text><text x="785" y="276" font-size="17" fill="#666" font-weight="400">Agent application</text><rect x="70" y="270" width="500" height="136" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="94" y="309" font-size="23" fill="#191919" font-weight="700">Network operations team</text><text x="94" y="343" font-size="17" fill="#666" font-weight="400">Set goals, teach the approach, review results.</text><text x="94" y="369" font-size="17" fill="#666" font-weight="400">Authorize the scope of supported changes.</text><rect x="660" y="300" width="340" height="106" rx="16" fill="#f4f4f4" stroke="#dedede" stroke-width="2"/><text x="682" y="337" font-size="23" fill="#191919" font-weight="700">Ask nimbls</text><text x="682" y="370" font-size="16" fill="#666" font-weight="400">Configure, create, and refine agents.</text><path d="M570 350H660" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><text x="578" y="332" font-size="14" fill="#666" font-weight="400">Guide</text><rect x="1050" y="300" width="370" height="106" rx="16" fill="#fff8da" stroke="#e8c236" stroke-width="2"/><text x="1072" y="337" font-size="23" fill="#191919" font-weight="700">Scheduled work</text><text x="1072" y="370" font-size="16" fill="#666" font-weight="400">Saved tasks run at configured times.</text><path d="M1235 406V489" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1250" y="451" font-size="16" fill="#666" font-weight="400">Run</text><path d="M1000 357H1020V472H1100V489" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="70" y="505" width="215" height="214" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="92" y="543" font-size="22" fill="#191919" font-weight="700">Network devices</text><text x="92" y="582" font-size="17" fill="#666" font-weight="400">Switches · routers</text><text x="92" y="608" font-size="17" fill="#666" font-weight="400">Wireless · endpoints</text><text x="92" y="634" font-size="17" fill="#666" font-weight="400">Status and syslogs</text><text x="92" y="660" font-size="17" fill="#666" font-weight="400">Supported changes</text><rect x="340" y="505" width="230" height="214" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="362" y="546" font-size="28" fill="#191919" font-weight="700">NIMBL</text><text x="362" y="588" font-size="17" fill="#666" font-weight="400">Network management</text><text x="362" y="614" font-size="17" fill="#666" font-weight="400">Device data and control</text><text x="362" y="640" font-size="17" fill="#666" font-weight="400">One configured</text><text x="362" y="666" font-size="17" fill="#666" font-weight="400">NIMBL connection</text><rect x="660" y="530" width="190" height="160" rx="16" fill="#f4f4f4" stroke="#dedede" stroke-width="2"/><text x="682" y="574" font-size="26" fill="#191919" font-weight="700">bbcli</text><text x="682" y="610" font-size="16" fill="#666" font-weight="400">Shared NIMBL</text><text x="682" y="636" font-size="16" fill="#666" font-weight="400">integration boundary</text><rect x="940" y="490" width="480" height="240" rx="16" fill="#fff8da" stroke="#e8c236" stroke-width="2"/><text x="964" y="530" font-size="28" fill="#191919" font-weight="700">Network agents</text><text x="964" y="572" font-size="19" fill="#393939" font-weight="400">Review events and produce daily reports</text><text x="964" y="598" font-size="19" fill="#393939" font-weight="400">Investigate issues using site history</text><text x="964" y="624" font-size="19" fill="#393939" font-weight="400">Carry out and verify authorized tasks</text><text x="964" y="698" font-size="17" fill="#666" font-weight="400">Default agents + agents you teach</text><path d="M285 610H340" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M570 610H660" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M850 610H940" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="72" y="763" font-size="19" fill="#191919" font-weight="700">Observe → investigate → act within scope → verify</text><text x="72" y="794" font-size="16" fill="#666" font-weight="400">Device access follows NIMBL → bbcli → agents.</text><text x="72" y="820" font-size="16" fill="#666" font-weight="400">Agents use the same path for supported operations.</text><rect x="660" y="797" width="350" height="116" rx="16" fill="#f4f4f4" stroke="#dedede" stroke-width="2"/><text x="682" y="833" font-size="21" fill="#191919" font-weight="700">Site history &amp; knowledge</text><text x="682" y="865" font-size="16" fill="#666" font-weight="400">Retained findings, important events,</text><text x="682" y="891" font-size="16" fill="#666" font-weight="400">and references to source evidence.</text><rect x="1050" y="797" width="370" height="116" rx="16" fill="#f4f4f4" stroke="#dedede" stroke-width="2"/><text x="1072" y="833" font-size="21" fill="#191919" font-weight="700">Results &amp; work history</text><text x="1072" y="865" font-size="16" fill="#666" font-weight="400">Reports, run records and outcomes.</text><text x="1072" y="891" font-size="16" fill="#666" font-weight="400">Review, reuse, and improve the work.</text><path d="M1020 730V760H835V797" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M1235 730V797" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="660" y="995" width="760" height="135" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="684" y="1035" font-size="25" fill="#191919" font-weight="700">Local LLM server</text><text x="684" y="1071" font-size="18" fill="#666" font-weight="400">Inference on your computer or an approved site server.</text><text x="684" y="1097" font-size="18" fill="#666" font-weight="400">Local-only tasks do not silently fall back to external models.</text><path d="M1420 610H1435V975H1235V995" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="70" y="1017" font-size="14" fill="#666" font-weight="700">THE MAIN WORKFLOW</text><text x="70" y="1052" font-size="22" fill="#191919" font-weight="700">Set it up. Let it run. Review the outcome.</text><text x="70" y="1090" font-size="18" fill="#666" font-weight="400">Conversation guides the work.</text><text x="70" y="1116" font-size="18" fill="#666" font-weight="400">Scheduled execution carries it forward.</text><rect x="1520" y="180" width="360" height="390" rx="16" fill="#fafafa" stroke="#dedede" stroke-width="2"/><rect x="1520" y="580" width="360" height="600" rx="16" fill="#fff" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="8 7"/><text x="1544" y="604" font-size="14" fill="#666" font-weight="700">EXTERNAL / OPTIONAL / FUTURE</text><text x="1544" y="215" font-size="14" fill="#666" font-weight="700">LOCAL CONTROL / FUTURE</text><text x="1544" y="260" font-size="24" fill="#191919" font-weight="700">External assistance</text><text x="1544" y="297" font-size="16" fill="#666" font-weight="400">For tasks needing additional analysis.</text><text x="1544" y="323" font-size="16" fill="#666" font-weight="400">Separate from local-only operation.</text><rect x="1544" y="400" width="312" height="144" rx="16" fill="#f4f4f4" stroke="#dedede" stroke-width="2"/><text x="1566" y="440" font-size="23" fill="#191919" font-weight="700">Disclosure gate</text><text x="1566" y="476" font-size="15" fill="#666" font-weight="400">Review permitted data and recipient.</text><text x="1566" y="502" font-size="15" fill="#666" font-weight="400">Block unreviewed data types.</text><path d="M1420 555H1500V472H1544" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="1544" y="615" width="312" height="125" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="1566" y="653" font-size="23" fill="#191919" font-weight="700">nimbls-relay</text><text x="1566" y="687" font-size="15" fill="#666" font-weight="400">Proposed controlled external route.</text><text x="1566" y="713" font-size="15" fill="#666" font-weight="400">Authenticated, encrypted transport.</text><path d="M1700 544V615" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="1544" y="815" width="312" height="116" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="1566" y="855" font-size="21" fill="#191919" font-weight="700">Approved frontier model</text><text x="1566" y="893" font-size="16" fill="#666" font-weight="400">Additional analysis and advice.</text><path d="M1700 740V815" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)" stroke-dasharray="7 6"/><text x="1544" y="1000" font-size="16" fill="#666" font-weight="400">Advice returns for local validation.</text><text x="1544" y="1026" font-size="16" fill="#666" font-weight="400">It does not authorize device changes.</text><text x="1544" y="1052" font-size="16" fill="#666" font-weight="400">No direct external device control.</text><text x="1544" y="1120" font-size="15" fill="#666" font-weight="400">Recipient data handling and retention</text><text x="1544" y="1146" font-size="15" fill="#666" font-weight="400">must be checked separately.</text><text x="48" y="1216" font-size="16" fill="#666" font-weight="400">Planned product architecture · Solid lines: primary relationships · Dashed lines: guidance or optional external path</text><text x="48" y="1247" font-size="16" fill="#666" font-weight="400">Not a deployed topology or completed security claim. General-purpose agents remain supported. nimbls is a provisional product name.</text></g></svg>