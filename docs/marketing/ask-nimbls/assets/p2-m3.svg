<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title"><title id="title">Find answers in your site’s history.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="47" font-size="14" fill="#64748b" font-weight="700">NIMBLS / NETWORK SITE MANAGEMENT</text><text x="48" y="105" font-size="38" fill="#191919" font-weight="700">Find answers in your site’s history.</text><text x="48" y="150" font-size="21" fill="#666" font-weight="400">Connects current issues with past events and device changes to help explain what happened and what to check next.</text><rect x="40" y="198" width="1520" height="364" rx="16" fill="#f3f6f9" stroke="#e1e7ed" stroke-width="2"/><rect x="70.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(92.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h32a5 5 0 0 1 5 5v23a5 5 0 0 1-5 5H19L7 46v-8a5 5 0 0 1-4-5V10a5 5 0 0 1 5-5Z"/><path d="M13 17h22M13 26h15"/></g><text x="92.0" y="354" font-size="23" fill="#191919" font-weight="700">Scope</text><text x="92.0" y="395" font-size="18" fill="#666" font-weight="400">Choose the device,</text><text x="92.0" y="421" font-size="18" fill="#666" font-weight="400">issue and time window.</text><path d="M408.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="444.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(466.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="20" ry="7"/><path d="M4 10v28c0 10 40 10 40 0V10M4 24c0 10 40 10 40 0"/></g><text x="466.0" y="354" font-size="23" fill="#191919" font-weight="700">Retrieve</text><text x="466.0" y="395" font-size="18" fill="#666" font-weight="400">Syslog findings, snapshots</text><text x="466.0" y="421" font-size="18" fill="#666" font-weight="400">and relevant prior cases.</text><path d="M782.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="818.0" y="245" width="338.0" height="252" rx="16" fill="#fff" stroke="#dce3e9" stroke-width="2"/><g transform="translate(840.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="14"/><path d="m31 31 13 13M12 20h16m-8-8v16"/></g><text x="840.0" y="354" font-size="23" fill="#191919" font-weight="700">Compare</text><text x="840.0" y="395" font-size="18" fill="#666" font-weight="400">Build a timeline.</text><text x="840.0" y="421" font-size="18" fill="#666" font-weight="400">Test similarities and gaps.</text><path d="M1156.0 370h36" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1192.0" y="245" width="338.0" height="252" rx="16" fill="#fff9df" stroke="#e8c236" stroke-width="2"/><g transform="translate(1214.0 268) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="1214.0" y="354" font-size="23" fill="#191919" font-weight="700">Explain</text><text x="1214.0" y="395" font-size="18" fill="#666" font-weight="400">Cite possible causes.</text><text x="1214.0" y="421" font-size="18" fill="#666" font-weight="400">Suggest what to verify next.</text><rect x="40" y="606" width="1520" height="119" rx="16" fill="#fff" stroke="#dedede" stroke-width="2"/><g transform="translate(67 638) scale(1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="140" y="646" font-size="14" fill="#64748b" font-weight="700">WHAT THE CUSTOMER GETS</text><text x="140" y="690" font-size="23" fill="#191919" font-weight="700">A sourced incident timeline, hypotheses, evidence gaps, and next checks.</text><text x="48" y="788" font-size="16" fill="#666" font-weight="400">A hypothesis is not a proven root cause. This investigation does not authorize device changes.</text><text x="48" y="820" font-size="15" fill="#64748b" font-weight="400">Planned capability · Concept diagram, not application UI · nimbls is a provisional name</text></g></svg>