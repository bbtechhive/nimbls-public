<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">POC delivery timeline: two to three weeks per stage</title><desc id="desc">Sequential POC 1 through 7, totaling fourteen weeks at two weeks per stage or twenty-one weeks at three weeks per stage. Weeks are relative to an agreed kickoff date.</desc><style>text{font-family:Arial,sans-serif;fill:#191919}</style><rect width="1440" height="700" fill="white"/><text x="38" y="54" font-size="32" font-weight="700">POC delivery timeline</text><text x="38" y="89" font-size="18">Planning estimate: 2–3 weeks per POC · Sequential delivery · 14–21 weeks total</text><text x="38" y="119" font-size="15" fill="#666">Week 1 starts at the agreed kickoff. No calendar start date is set. Validation is included in each stage.</text><path d="M240 165v236" stroke="#e5e5e5"/><text x="267" y="156" text-anchor="middle" font-size="13">1</text><path d="M294 165v236" stroke="#e5e5e5"/><text x="321" y="156" text-anchor="middle" font-size="13">2</text><path d="M348 165v236" stroke="#e5e5e5"/><text x="375" y="156" text-anchor="middle" font-size="13">3</text><path d="M402 165v236" stroke="#e5e5e5"/><text x="429" y="156" text-anchor="middle" font-size="13">4</text><path d="M456 165v236" stroke="#e5e5e5"/><text x="483" y="156" text-anchor="middle" font-size="13">5</text><path d="M510 165v236" stroke="#e5e5e5"/><text x="537" y="156" text-anchor="middle" font-size="13">6</text><path d="M564 165v236" stroke="#e5e5e5"/><text x="591" y="156" text-anchor="middle" font-size="13">7</text><path d="M618 165v236" stroke="#e5e5e5"/><text x="645" y="156" text-anchor="middle" font-size="13">8</text><path d="M672 165v236" stroke="#e5e5e5"/><text x="699" y="156" text-anchor="middle" font-size="13">9</text><path d="M726 165v236" stroke="#e5e5e5"/><text x="753" y="156" text-anchor="middle" font-size="13">10</text><path d="M780 165v236" stroke="#e5e5e5"/><text x="807" y="156" text-anchor="middle" font-size="13">11</text><path d="M834 165v236" stroke="#e5e5e5"/><text x="861" y="156" text-anchor="middle" font-size="13">12</text><path d="M888 165v236" stroke="#e5e5e5"/><text x="915" y="156" text-anchor="middle" font-size="13">13</text><path d="M942 165v236" stroke="#e5e5e5"/><text x="969" y="156" text-anchor="middle" font-size="13">14</text><path d="M996 165v236" stroke="#e5e5e5"/><text x="1023" y="156" text-anchor="middle" font-size="13">15</text><path d="M1050 165v236" stroke="#e5e5e5"/><text x="1077" y="156" text-anchor="middle" font-size="13">16</text><path d="M1104 165v236" stroke="#e5e5e5"/><text x="1131" y="156" text-anchor="middle" font-size="13">17</text><path d="M1158 165v236" stroke="#e5e5e5"/><text x="1185" y="156" text-anchor="middle" font-size="13">18</text><path d="M1212 165v236" stroke="#e5e5e5"/><text x="1239" y="156" text-anchor="middle" font-size="13">19</text><path d="M1266 165v236" stroke="#e5e5e5"/><text x="1293" y="156" text-anchor="middle" font-size="13">20</text><path d="M1320 165v236" stroke="#e5e5e5"/><text x="1347" y="156" text-anchor="middle" font-size="13">21</text><path d="M1374 165v236" stroke="#e5e5e5"/><text x="38" y="156" font-size="14" fill="#666">RELATIVE WEEK</text><text x="38" y="214" font-size="19" font-weight="700">2 weeks / POC</text><text x="38" y="240" font-size="15">Total: 14 weeks</text><rect x="240" y="185" width="103" height="76" rx="6" fill="#e8c236"/><text x="291.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 1</text><text x="291.5" y="241" text-anchor="middle" font-size="13">W1–2</text><rect x="348" y="185" width="103" height="76" rx="6" fill="#ededed"/><text x="399.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 2</text><text x="399.5" y="241" text-anchor="middle" font-size="13">W3–4</text><rect x="456" y="185" width="103" height="76" rx="6" fill="#e8c236"/><text x="507.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 3</text><text x="507.5" y="241" text-anchor="middle" font-size="13">W5–6</text><rect x="564" y="185" width="103" height="76" rx="6" fill="#ededed"/><text x="615.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 4</text><text x="615.5" y="241" text-anchor="middle" font-size="13">W7–8</text><rect x="672" y="185" width="103" height="76" rx="6" fill="#e8c236"/><text x="723.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 5</text><text x="723.5" y="241" text-anchor="middle" font-size="13">W9–10</text><rect x="780" y="185" width="103" height="76" rx="6" fill="#ededed"/><text x="831.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 6</text><text x="831.5" y="241" text-anchor="middle" font-size="13">W11–12</text><rect x="888" y="185" width="103" height="76" rx="6" fill="#e8c236"/><text x="939.5" y="216" text-anchor="middle" font-size="18" font-weight="700">POC 7</text><text x="939.5" y="241" text-anchor="middle" font-size="13">W13–14</text><text x="38" y="334" font-size="19" font-weight="700">3 weeks / POC</text><text x="38" y="360" font-size="15">Total: 21 weeks</text><rect x="240" y="305" width="157" height="76" rx="6" fill="#e8c236"/><text x="318.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 1</text><text x="318.5" y="361" text-anchor="middle" font-size="13">W1–3</text><rect x="402" y="305" width="157" height="76" rx="6" fill="#ededed"/><text x="480.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 2</text><text x="480.5" y="361" text-anchor="middle" font-size="13">W4–6</text><rect x="564" y="305" width="157" height="76" rx="6" fill="#e8c236"/><text x="642.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 3</text><text x="642.5" y="361" text-anchor="middle" font-size="13">W7–9</text><rect x="726" y="305" width="157" height="76" rx="6" fill="#ededed"/><text x="804.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 4</text><text x="804.5" y="361" text-anchor="middle" font-size="13">W10–12</text><rect x="888" y="305" width="157" height="76" rx="6" fill="#e8c236"/><text x="966.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 5</text><text x="966.5" y="361" text-anchor="middle" font-size="13">W13–15</text><rect x="1050" y="305" width="157" height="76" rx="6" fill="#ededed"/><text x="1128.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 6</text><text x="1128.5" y="361" text-anchor="middle" font-size="13">W16–18</text><rect x="1212" y="305" width="157" height="76" rx="6" fill="#e8c236"/><text x="1290.5" y="336" text-anchor="middle" font-size="18" font-weight="700">POC 7</text><text x="1290.5" y="361" text-anchor="middle" font-size="13">W19–21</text><text x="38" y="467" font-size="16" font-weight="700">POC 1</text><text x="38" y="491" font-size="16">Agents &amp; automation</text><text x="385" y="467" font-size="16" font-weight="700">POC 2</text><text x="385" y="491" font-size="16">Site history</text><text x="732" y="467" font-size="16" font-weight="700">POC 3</text><text x="732" y="491" font-size="16">Local AI</text><text x="1079" y="467" font-size="16" font-weight="700">POC 4</text><text x="1079" y="491" font-size="16">Results management</text><text x="38" y="528" font-size="16" font-weight="700">POC 5</text><text x="38" y="552" font-size="16">Agent improvement</text><text x="385" y="528" font-size="16" font-weight="700">POC 6</text><text x="385" y="552" font-size="16">External assistance</text><text x="732" y="528" font-size="16" font-weight="700">POC 7</text><text x="732" y="552" font-size="16">Device verification</text><text x="38" y="617" font-size="15">Move to the next stage after its acceptance checks pass. A shorter stage brings subsequent stages forward.</text><text x="38" y="647" font-size="15">Assumes continuous capacity and ready test inputs. Integration delays or scope changes may extend the estimate.</text><text x="38" y="678" font-size="13" fill="#666">Planned capabilities, not released features · nimbls is a provisional name</text></svg>