<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title"><title id="title">Results Center workflow concept</title><style>text{font-family:Arial,sans-serif;fill:#191919}</style><rect width="1200" height="370" fill="#fff"/><text x="32" y="47" font-size="26" font-weight="700">Results Center</text><text x="32" y="80" font-size="17" fill="#666">Work becomes something you can use.</text><rect x="32" y="120" width="266" height="154" rx="8" fill="#f4f4f4" stroke="#e2e2e2"/><rect x="50" y="138" width="30" height="28" rx="6" fill="#e8c236"/><text x="57" y="157" font-size="14">01</text><text x="50" y="204" font-size="22" font-weight="700">Find</text><text x="50" y="238" font-size="16">Locate matching reports.</text><path d="M302 197h19m-6-5 6 5-6 5" fill="none" stroke="#666" stroke-width="2"/><rect x="326" y="120" width="266" height="154" rx="8" fill="#f4f4f4" stroke="#e2e2e2"/><rect x="344" y="138" width="30" height="28" rx="6" fill="#e8c236"/><text x="351" y="157" font-size="14">02</text><text x="344" y="204" font-size="22" font-weight="700">Explore</text><text x="344" y="238" font-size="16">Read and filter results.</text><path d="M596 197h19m-6-5 6 5-6 5" fill="none" stroke="#666" stroke-width="2"/><rect x="620" y="120" width="266" height="154" rx="8" fill="#f4f4f4" stroke="#e2e2e2"/><rect x="638" y="138" width="30" height="28" rx="6" fill="#e8c236"/><text x="645" y="157" font-size="14">03</text><text x="638" y="204" font-size="22" font-weight="700">Refine</text><text x="638" y="238" font-size="16">Request a useful format.</text><path d="M890 197h19m-6-5 6 5-6 5" fill="none" stroke="#666" stroke-width="2"/><rect x="914" y="120" width="266" height="154" rx="8" fill="#f4f4f4" stroke="#e2e2e2"/><rect x="932" y="138" width="30" height="28" rx="6" fill="#e8c236"/><text x="939" y="157" font-size="14">04</text><text x="932" y="204" font-size="22" font-weight="700">Organize</text><text x="932" y="238" font-size="16">Archive with clear rules.</text><text x="32" y="318" font-size="15">Basics: POC 1 · Advanced: POC 4 · Planned capability</text><text x="32" y="346" font-size="13" fill="#666">Workflow concept, not an application screen · nimbls is a provisional name</text></svg>