<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title"><title id="title">Every incident adds context.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#737373" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="47" font-size="14" fill="#64748b" font-weight="700">NIMBLS / NETWORK SITE MANAGEMENT</text><text x="48" y="105" font-size="38" fill="#191919" font-weight="700">Every incident adds context.</text><text x="48" y="150" font-size="21" fill="#666" font-weight="400">Retain the important evidence. Bring it into the next investigation.</text><rect x="50" y="230" width="365" height="112" rx="16" fill="#f3f6f9" stroke="#dedede" stroke-width="2"/><g transform="translate(72 260) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="2" width="20" height="14" rx="3"/><path d="M24 16v13M6 29h36M6 29v6m18-6v6m18-6v6"/><rect x="1" y="35" width="10" height="10" rx="2"/><rect x="19" y="35" width="10" height="10" rx="2"/><rect x="37" y="35" width="10" height="10" rx="2"/></g><text x="128" y="274" font-size="22" fill="#191919" font-weight="700">Device observations</text><text x="128" y="309" font-size="17" fill="#666" font-weight="400">State and changes</text><path d="M415 286H465V420H520" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="365" width="365" height="112" rx="16" fill="#f3f6f9" stroke="#dedede" stroke-width="2"/><g transform="translate(72 395) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="32" height="42" rx="4"/><path d="M16 14h16M16 23h16M16 32h11"/></g><text x="128" y="409" font-size="22" fill="#191919" font-weight="700">Important events</text><text x="128" y="444" font-size="17" fill="#666" font-weight="400">Scoped syslogs and findings</text><path d="M415 421H465V420H520" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="500" width="365" height="112" rx="16" fill="#f3f6f9" stroke="#dedede" stroke-width="2"/><g transform="translate(72 530) scale(0.8)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3 43 11v15c0 10-19 19-19 19S5 36 5 26V11Z"/><path d="m14 23 7 7 13-14"/></g><text x="128" y="544" font-size="22" fill="#191919" font-weight="700">Previous investigations</text><text x="128" y="579" font-size="17" fill="#666" font-weight="400">Actions and observed outcomes</text><path d="M415 556H465V420H520" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="270" width="465" height="307" rx="16" fill="#fff9df" stroke="#e8c236" stroke-width="2"/><g transform="translate(550 301) scale(1.1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="20" ry="7"/><path d="M4 10v28c0 10 40 10 40 0V10M4 24c0 10 40 10 40 0"/></g><text x="624" y="330" font-size="29" fill="#191919" font-weight="700">Site knowledge</text><text x="550" y="395" font-size="21" fill="#666" font-weight="400">Keep source, time, and device context.</text><text x="550" y="421" font-size="21" fill="#666" font-weight="400">Retain useful evidence under clear rules.</text><text x="550" y="447" font-size="21" fill="#666" font-weight="400">Find relevant cases across agent runs.</text><path d="M985 420H1070" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1070" y="270" width="475" height="307" rx="16" fill="#f3f6f9" stroke="#dedede" stroke-width="2"/><g transform="translate(1100 301) scale(1.1)" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="14"/><path d="m31 31 13 13M12 20h16m-8-8v16"/></g><text x="1174" y="330" font-size="29" fill="#191919" font-weight="700">Investigate</text><text x="1100" y="395" font-size="20" fill="#666" font-weight="400">Compare a recurring link interruption.</text><text x="1100" y="421" font-size="20" fill="#666" font-weight="400">Review what changed and helped before.</text><text x="1100" y="447" font-size="20" fill="#666" font-weight="400">Separate evidence from uncertainty.</text><path d="M1300 577V673H750V577" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="785" y="710" font-size="21" fill="#191919" font-weight="700">Retain the new findings for the next case.</text><text x="48" y="788" font-size="16" fill="#666" font-weight="400">Similar events and correlated changes help investigation; they do not prove root cause.</text><text x="48" y="820" font-size="15" fill="#64748b" font-weight="400">Planned capability · Concept diagram, not application UI · nimbls is a provisional name</text></g></svg>